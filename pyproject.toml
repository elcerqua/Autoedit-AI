[project]
name = "autocut-ai"
version = "0.1.0"
description = "Auto Cut AI, LLM-assisted video editing for spoken informational clips."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "loguru>=0.7",
    "ollama>=0.6",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# Il repository contiene anche asset e dati con nomi compatibili con pacchetti
# Python. Dichiarare esplicitamente il solo package applicativo evita che
# setuptools tenti di distribuire cartelle come ``models`` o ``frontend``.
[tool.setuptools]
packages = ["autocut_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: exercises real media fixtures or external binaries",
    "slow: marks tests that are intentionally slower than unit tests",
]
